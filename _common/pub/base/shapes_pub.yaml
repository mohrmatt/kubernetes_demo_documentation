---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shapes-pub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shapes-pub-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shapes-pub-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shapes-pub-node-reader
subjects:
- kind: ServiceAccount
  name: shapes-pub
  namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: shapes-pub
  name: shapes-pub
spec:
  selector:
    matchLabels:
      app: shapes-pub
  template:
    metadata:
      labels:
        app: shapes-pub
    spec:
      serviceAccountName: shapes-pub
      initContainers:
      - name: init-color
        image: bitnami/kubectl:latest
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command: ["/bin/sh", "-c"]
        args:
        - |
          COLOR=$(kubectl get node "$NODE_NAME" -o go-template='{{index .metadata.labels "shapes/color"}}')
          [ -z "$COLOR" ] && COLOR="BLUE"
          echo "export NODE_COLOR=$COLOR" > /shared/color.env
          echo "Publisher color resolved: $COLOR"
        volumeMounts:
        - name: shared-color
          mountPath: /shared
      - name: init-user-qos-profiles
        image: <static repo ip>:5000/shapes_multi_arch
        command: ["sh", "-c", "if [ ! -f /working/USER_QOS_PROFILES.xml ]; then cp /app/USER_QOS_PROFILES.xml /working/USER_QOS_PROFILES.xml; fi"]
        volumeMounts:
        - name: user-qos-profiles
          mountPath: /working
      containers:
      - image: <static repo ip>:5000/shapes_multi_arch
        name: shapes-pub
        envFrom:
        - configMapRef:
            name: shapes-pub-config
        command: ["/bin/sh", "-c"]
        args:
        - >
          . /shared/color.env;
          exec /app/run-shapes.sh -c "$NODE_COLOR" ${PUBLISHER_ARGS}
        imagePullPolicy: Always
        volumeMounts:
        - name: user-qos-profiles
          mountPath: /app/USER_QOS_PROFILES.xml
          subPath: USER_QOS_PROFILES.xml
        - name: shared-color
          mountPath: /shared
      volumes:
      - name: user-qos-profiles
        hostPath:
          path: /opt/shapes/qos
          type: DirectoryOrCreate
      - name: shared-color
        emptyDir: {}
      imagePullSecrets:
      - name: myregistrykey
