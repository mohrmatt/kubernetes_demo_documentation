apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-cleanup
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-cleanup-nad-reader
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-cleanup-nad-reader
subjects:
  - kind: ServiceAccount
    name: cni-cleanup
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cni-cleanup-nad-reader
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-cleanup
  namespace: kube-system
  labels:
    app: cni-cleanup
spec:
  selector:
    matchLabels:
      app: cni-cleanup
  template:
    metadata:
      labels:
        app: cni-cleanup
    spec:
      serviceAccountName: cni-cleanup
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: detect-macvlan-interface
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
          args:
            - -c
            - |
              set -e
              echo "Detecting macvlan parent interface from NetworkAttachmentDefinition..."

              waited=0
              NAD_NAMESPACE=""
              while [ -z "$NAD_NAMESPACE" ]; do
                NAD_NAMESPACE=$(kubectl get net-attach-def -A --no-headers 2>/dev/null | awk '$2=="macvlan-config"{print $1; exit}')
                if [ -n "$NAD_NAMESPACE" ]; then
                  break
                fi
                if [ "$waited" -ge 60 ]; then
                  echo "Could not find macvlan-config NAD within timeout; skipping promisc disable"
                  exit 0
                fi
                sleep 2
                waited=$((waited + 2))
              done

              NAD_CONFIG=$(kubectl get net-attach-def macvlan-config -n "$NAD_NAMESPACE" -o jsonpath='{.spec.config}')
              PARENT_IF=$(echo "$NAD_CONFIG" | sed -n 's/.*"master"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | tr -d '\r' | xargs)

              if [ -z "$PARENT_IF" ]; then
                echo "Could not determine macvlan master interface from NAD; skipping promisc disable"
                exit 0
              fi

              echo "$PARENT_IF" > /shared/parent_if
              echo "Detected interface: $PARENT_IF"
          securityContext:
            privileged: true
          volumeMounts:
            - name: shared-state
              mountPath: /shared
        - name: cleanup-cni
          image: busybox:1.36
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - /bin/sh
          args:
            - -c
            - |
              set -e

              # Disable promiscuous mode on the MACVLAN parent interface if discovered.
              if [ -f /shared/parent_if ]; then
                PARENT_IF=$(cat /shared/parent_if | tr -d '\r' | xargs)
                if [ -n "$PARENT_IF" ] && ip link show "$PARENT_IF" >/dev/null 2>&1; then
                  echo "Disabling promiscuous mode on $PARENT_IF"
                  ip link set "$PARENT_IF" promisc off || echo "Warning: Failed to disable promiscuous mode on $PARENT_IF"
                else
                  echo "Skipping promiscuous disable; interface not found: $PARENT_IF"
                fi
              else
                echo "No detected interface file found; skipping promiscuous disable"
              fi

              # Remove any multus/whereabouts artifacts from CNI config and bin dirs.
              find /host/etc/cni/net.d /host/opt/cni/bin \
                -maxdepth 1 \
                \( -iname '*multus*' -o -iname '*whereabouts*' \) \
                -exec rm -rf {} +

              # Remove old CNI plugin configs (antrea, cilium, etc.) that may be leftover from previous deployments
              # These will be replaced by the new CNI when deployed
              find /host/etc/cni/net.d \
                -maxdepth 1 \
                -type f \
                \( -iname '*antrea*' -o -iname '*cilium*' -o -iname '*calico*' -o -iname '*weave*' \) \
                -exec rm -f {} +

              # Also clean K3s-specific CNI config path
              find /host/var/lib/rancher/k3s/agent/etc/cni/net.d \
                -maxdepth 1 \
                -type f \
                \( -iname '*antrea*' -o -iname '*cilium*' -o -iname '*calico*' -o -iname '*weave*' \) \
                -exec rm -f {} +
          volumeMounts:
            - name: host-etc-cni-netd
              mountPath: /host/etc/cni/net.d
            - name: host-opt-cni-bin
              mountPath: /host/opt/cni/bin
            - name: k3s-cni-netd
              mountPath: /host/var/lib/rancher/k3s/agent/etc/cni/net.d
            - name: shared-state
              mountPath: /shared
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.6
      volumes:
        - name: host-etc-cni-netd
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: host-opt-cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: k3s-cni-netd
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
            type: DirectoryOrCreate
        - name: shared-state
          emptyDir: {}
