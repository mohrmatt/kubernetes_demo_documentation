apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-plugins-installer
  namespace: kube-system
  labels:
    app: cni-plugins-installer
spec:
  selector:
    matchLabels:
      app: cni-plugins-installer
  template:
    metadata:
      labels:
        app: cni-plugins-installer
    spec:
      hostNetwork: true
      serviceAccountName: cni-plugins-installer
      initContainers:
        - name: wait-for-k3s-cni-path-linker
          image: busybox:1.36
          command:
            - /bin/sh
          args:
            - -c
            - |
              echo "Waiting for k3s-cni-path-linker to complete..."
              # Wait for both symlinks to be created
              while [ ! -L /host/etc/cni/net.d ] && [ ! -L /host/opt/cni/bin ]; do
                echo "Waiting for symlinks to be created by k3s-cni-path-linker..."
                sleep 2
              done
              echo "k3s-cni-path-linker has completed. Proceeding with CNI plugin installation."
          volumeMounts:
            - mountPath: /host/etc/cni
              name: host-etc-cni
              readOnly: true
            - mountPath: /host/opt/cni
              name: host-opt-cni
              readOnly: true
        - name: install-cni-plugins
          image: docker.io/library/cni-plugins-assets:v1.4.0
          command:
            - /bin/sh
          args:
            - -c
            - |
              echo "Starting CNI plugins installation"

              mkdir -p /host/opt/cni/bin

              ARCH=$(uname -m)
              case $ARCH in
                x86_64)
                  ARCH="amd64"
                  ;;
                aarch64)
                  ARCH="arm64"
                  ;;
                armv7l)
                  ARCH="arm"
                  ;;
                *)
                  echo "Unsupported architecture: $ARCH"
                  exit 1
                  ;;
              esac

              CNI_VERSION="v1.4.0"
              ARCHIVE="/opt/cni-plugins/cni-plugins-linux-${ARCH}-${CNI_VERSION}.tgz"

              echo "Detected architecture: $ARCH"
              echo "Using local CNI plugins archive: $ARCHIVE"
              [ -f "$ARCHIVE" ] || {
                echo "Local CNI archive not found: $ARCHIVE"
                ls -la /opt/cni-plugins || true
                exit 1
              }

              echo "Extracting CNI plugins to /host/opt/cni/bin/"
              tar -xzf "$ARCHIVE" -C /host/opt/cni/bin/

              chmod +x /host/opt/cni/bin/*

              echo "CNI plugins installation completed"
              ls -la /host/opt/cni/bin/
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.6
      volumes:
        - name: host-etc-cni
          hostPath:
            path: /etc/cni
            type: DirectoryOrCreate
        - name: host-opt-cni
          hostPath:
            path: /opt/cni
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-plugins-installer
  namespace: kube-system
